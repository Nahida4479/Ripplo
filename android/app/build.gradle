plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def ripploKeystore = System.getenv('RIPPLO_KEYSTORE_FILE')

android {
    namespace = "io.github.nahida4479.ripplo"
    def ciNdk = System.getenv("ANDROID_NDK_LATEST_HOME")
    if (ciNdk) {
        ndkPath = ciNdk
        ndkVersion = new File(ciNdk).name
    } else {
        ndkVersion = flutter.ndkVersion
    }
    compileSdk = 36
    defaultConfig {
        applicationId "io.github.nahida4479.ripplo"
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packaging {
        jniLibs {
            excludes += ['**/libsignal_jni*.dylib', '**/signal_jni*.dll', '**/libsignal_jni_testing.so']
        }
    }
    signingConfigs {
        if (ripploKeystore) {
            release {
                storeFile file(ripploKeystore)
                storePassword System.getenv('RIPPLO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RIPPLO_KEY_ALIAS')
                keyPassword System.getenv('RIPPLO_KEY_PASSWORD')
            }
        }
    }
    flavorDimensions "store"
    productFlavors {
        full {
            dimension "store"
        }
        play {
            dimension "store"
        }
    }
    buildTypes {
        release {
            if (ripploKeystore) signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "org.signal:libsignal-android:0.108.5"
    implementation "androidx.biometric:biometric:1.1.0"
    // Google Nearby Connections: Play build only (F-Droid / GitHub builds stay free of Google services)
    playImplementation "com.google.android.gms:play-services-nearby:19.3.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.signal:libsignal-client:0.108.5"
}
