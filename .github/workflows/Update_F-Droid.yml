name: Publish F-Droid repo
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag wydania z APK, np. v0.22.0"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  repo:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Restore signing config and metadata
        env:
          KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_P12_BASE64 }}
          CONFIG_B64: ${{ secrets.FDROID_CONFIG_YML_BASE64 }}
        run: |
          mkdir -p fdroid-work/repo
          cp -r fdroid/metadata fdroid-work/
          echo "$KEYSTORE_B64" | base64 -d > fdroid-work/keystore.p12
          echo "$CONFIG_B64" | base64 -d > fdroid-work/config.yml
          chmod 600 fdroid-work/keystore.p12 fdroid-work/config.yml

      - name: Download APK from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -p "*.apk" -D fdroid-work/repo

      - name: Build index
        working-directory: fdroid-work
        run: |
          fdroid update -c
          fdroid update

      - name: Copy into Pages folder and push
        run: |
          rm -rf github_pages/repo
          cp -r fdroid-work/repo github_pages/repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github_pages/repo
          git diff --cached --quiet || git commit -m "Publish F-Droid repo $TAG"
          git push

      - name: Deploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
