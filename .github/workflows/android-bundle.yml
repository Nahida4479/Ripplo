name: Android bundle (AAB + APKS)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned bundletool release. Check https://github.com/google/bundletool/releases for a newer one.
  BUNDLETOOL_VERSION: "1.17.2"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Compute version
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[A-Za-z0-9.]+)?$ ]] || { echo "Bad tag: $tag"; exit 1; }
            name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          else
            name="$(node -p "require('./package.json').version")"
            tag="v${name}-dev${GITHUB_RUN_NUMBER}"
            code="$GITHUB_RUN_NUMBER"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Prepare signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KS_B64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret missing; an AAB/APKS must be signed"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ripplo.jks"
          {
            echo "RIPPLO_KEYSTORE_FILE=$RUNNER_TEMP/ripplo.jks"
            echo "RIPPLO_KEYSTORE_PASSWORD=$KS_PASS"
            echo "RIPPLO_KEY_ALIAS=$KEY_ALIAS"
            echo "RIPPLO_KEY_PASSWORD=$KEY_PASS"
            echo "BT_JAR=$RUNNER_TEMP/bundletool.jar"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$KEY_PASS"

      - name: Build signed AAB
        working-directory: android
        env:
          VER_NAME: ${{ steps.ver.outputs.name }}
          VER_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          ./gradlew bundleRelease \
            -PversionName="$VER_NAME" \
            -PversionCode="$VER_CODE"

      - name: Verify AAB signature and collect
        env:
          tag: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          src=$(ls android/app/build/outputs/bundle/release/*.aab | head -n1)
          cp "$src" "out/Ripplo-$tag.aab"
          jarsigner -verify "out/Ripplo-$tag.aab"

      - name: Download bundletool
        run: |
          set -euo pipefail
          curl -fsSL -o "$BT_JAR" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

      - name: Build signed APKS (universal)
        env:
          tag: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          java -jar "$BT_JAR" build-apks \
            --bundle="out/Ripplo-$tag.aab" \
            --output="out/Ripplo-$tag.apks" \
            --mode=universal \
            --ks="$RIPPLO_KEYSTORE_FILE" \
            --ks-key-alias="$RIPPLO_KEY_ALIAS" \
            --ks-pass="pass:${RIPPLO_KEYSTORE_PASSWORD}" \
            --key-pass="pass:${RIPPLO_KEY_PASSWORD}"

      - name: Checksums
        working-directory: out
        run: sha256sum Ripplo-* > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: android-bundle
          path: out/*
