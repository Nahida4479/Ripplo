name: Build

on:
  push:
    tags: ['v*']
    branches: [flutter]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Compute version
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[A-Za-z0-9.]+)?$ ]] || { echo "Bad tag: $tag"; exit 1; }
            name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          else
            name="$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)"
            tag="v${name}-dev${GITHUB_RUN_NUMBER}"
            code="$GITHUB_RUN_NUMBER"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Prepare signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KS_B64" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 secret missing; refusing to build an unsigned release"
              exit 1
            fi
            echo "::warning::No keystore secret; building unsigned APK"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ripplo.jks"
          {
            echo "RIPPLO_KEYSTORE_FILE=$RUNNER_TEMP/ripplo.jks"
            echo "RIPPLO_KEYSTORE_PASSWORD=$KS_PASS"
            echo "RIPPLO_KEY_ALIAS=$KEY_ALIAS"
            echo "RIPPLO_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$KEY_PASS"

      - name: Signal crypto unit tests
        working-directory: android
        run: |
          for i in 1 2 3; do ./gradlew testFullReleaseUnitTest && exit 0; sleep $((i * 30)); done
          exit 1

      - name: Build release APK
        env:
          VER_NAME: ${{ steps.ver.outputs.name }}
          VER_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          flutter build apk --release --flavor full \
            --build-name "$VER_NAME" \
            --build-number "$VER_CODE"

      - name: Verify signature and collect
        env:
          tag: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir out
          src=build/app/outputs/flutter-apk/app-full-release.apk
          cp "$src" "out/Ripplo-$tag.apk"
          if [[ -n "${RIPPLO_KEYSTORE_FILE:-}" ]]; then
            bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
            "$bt/apksigner" verify --print-certs "out/Ripplo-$tag.apk" | tee "$RUNNER_TEMP/certs.txt"
            grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}' > out/apk-cert-sha256.txt
          fi

      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: android
          path: out/*

      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'branch' && github.event_name == 'push'
        with:
          name: android-test
          path: out/*
          retention-days: 14

  ios:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get

      - name: Compute version
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[A-Za-z0-9.]+)?$ ]] || { echo "Bad tag: $tag"; exit 1; }
            name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          else
            name="$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)"
            tag="v${name}-dev${GITHUB_RUN_NUMBER}"
            code="$GITHUB_RUN_NUMBER"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iOS app
        env:
          VER_NAME: ${{ steps.ver.outputs.name }}
          VER_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --build-name "$VER_NAME" \
            --build-number "$VER_CODE"

      - name: Build unsigned IPA
        env:
          tag: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p out "$RUNNER_TEMP/ipa/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/out/Ripplo-${tag}-beta-unsigned-for_developers.ipa" Payload)

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: out/*

  play:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get

      - name: Compute version
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[A-Za-z0-9.]+)?$ ]] || { echo "Bad tag: $tag"; exit 1; }
            name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          else
            name="$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)"
            tag="v${name}-dev${GITHUB_RUN_NUMBER}"
            code="$GITHUB_RUN_NUMBER"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Prepare signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KS_B64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret missing; an AAB must be signed"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ripplo.jks"
          {
            echo "RIPPLO_KEYSTORE_FILE=$RUNNER_TEMP/ripplo.jks"
            echo "RIPPLO_KEYSTORE_PASSWORD=$KS_PASS"
            echo "RIPPLO_KEY_ALIAS=$KEY_ALIAS"
            echo "RIPPLO_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$KEY_PASS"

      - name: Build signed Play AAB
        env:
          VER_NAME: ${{ steps.ver.outputs.name }}
          VER_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            flutter build appbundle --release --flavor play --build-name "$VER_NAME" --build-number "$VER_CODE" && exit 0
            sleep $((i * 30))
          done
          exit 1

      - name: Verify permission is absent and collect
        env:
          tag: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          src=build/app/outputs/bundle/playRelease/app-play-release.aab
          jarsigner -verify "$src"
          unzip -p "$src" base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/m.pb"
          if grep -aq REQUEST_INSTALL_PACKAGES "$RUNNER_TEMP/m.pb"; then
            echo "::error::REQUEST_INSTALL_PACKAGES still present in Play AAB"
            exit 1
          fi
          cp "$src" "out/Ripplo-$tag-play.aab"

      - uses: actions/upload-artifact@v7
        with:
          name: play
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, play]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dl
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dl
          [[ -s apk-cert-sha256.txt ]] || { echo "::error::missing APK cert digest"; exit 1; }
          sha256sum Ripplo-* > SHA256SUMS
          {
            echo "APK signing certificate SHA-256: \`$(cat apk-cert-sha256.txt)\`"
            echo
            echo "SHA256SUMS:"
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
          } > ../notes.md
          gh release create "$GITHUB_REF_NAME" --generate-notes --notes-file ../notes.md \
            Ripplo-*.apk Ripplo-*.ipa Ripplo-*.aab SHA256SUMS

      - name: Publish F-Droid repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run Update_F-Droid.yml --ref main -f tag="$GITHUB_REF_NAME"

  google-play:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [play]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: play
          path: dl

      - name: Check Play credentials
        id: cred
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$SA" ]]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON missing; skipping Google Play upload"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Google Play
        if: steps.cred.outputs.go == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.nahida4479.ripplo
          releaseFiles: dl/Ripplo-*-play.aab
          track: alpha
          status: ${{ vars.PLAY_STATUS || 'draft' }}
          releaseName: ${{ github.ref_name }}
